<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uluslararası Fuar Rehberi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; padding: 25px; background: #1e293b; color: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        header h1 { margin-bottom: 10px; font-size: 32px; }
        header p { color: #cbd5e1; font-size: 16px; }
        .controls { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
        input, select { padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; background: white; }
        input { flex: 1; min-width: 280px; max-width: 500px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08); border-top: 5px solid #2563eb; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.12); }
        .card h3 { font-size: 19px; color: #0f172a; margin-bottom: 12px; line-height: 1.4; }
        .tag { display: inline-block; background: #eff6ff; color: #1d4ed8; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 14px; }
        .info { font-size: 14px; color: #64748b; margin-bottom: 8px; }
        .info strong { color: #334155; }
    </style>
</head>
<body>

<header>
    <h1>🌍 Uluslararası Fuar Rehberi</h1>
    <p>Dünya genelindeki kapsamlı fuar listesini arayın, filtreleyin ve inceleyin.</p>
</header>

<div class="controls">
    <input type="text" id="searchInput" placeholder="Fuar adı, şehir veya ülke ara..." oninput="filterFairs()">
    <select id="sectorFilter" onchange="filterFairs()">
        <option value="">Tüm Sektörler</option>
    </select>
</div>

<div class="grid" id="fairsGrid"></div>

    { ad: "GITEX Global Technology Week", sektor: "Bilişim & Yazılım", ulke: "BAE", sehir: "Dubai", tarih: "Ekim 2026" },
    { ad: "SABDEX Savunma Sanayii Fuarı", sektor: "Savunma & Havacılık", ulke: "Türkiye", sehir: "İstanbul", tarih: "Temmuz 2027" },
    { ad: "IDEF Uluslararası Savunma Sanayii", sektor: "Savunma & Havacılık", ulke: "Türkiye", sehir: "Ankara", tarih: "Mayıs 2027" },
    { ad: "MWC Barcelona Mobil Dünya Kongresi", sektor: "Bilişim & Yazılım", ulke: "İspanya", sehir: "Barselona", tarih: "Mart 2027" }
];

const grid = document.getElementById('fairsGrid');
const sectorFilter = document.getElementById('sectorFilter');

const sektorler = [...new Set(fuarlar.map(f => f.sektor))];
sektorler.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.innerText = s;
    sectorFilter.appendChild(opt);
});

function displayFairs(items) {
    grid.innerHTML = items.map(f => `
        <div class="card">
            <span class="tag">${f.sektor}</span>
            <h3>${f.ad}</h3>
            <div class="info"><strong>Ülke / Şehir:</strong> ${f.ulke} - ${f.sehir}</div>
            <div class="info"><strong>Tarih:</strong> ${f.tarih}</div>
        </div>
    `).join('');
}

function filterFairs() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const sector = sectorFilter.value;

    const filtered = fuarlar.filter(f => {
        const matchesSearch = f.ad.toLowerCase().includes(search) || 
                              f.ulke.toLowerCase().includes(search) || 
                              f.sehir.toLowerCase().includes(search);
        const matchesSector = sector === "" || f.sektor === sector;
        return matchesSearch && matchesSector;
    });

    displayFairs(filtered);
}

displayFairs(fuarlar);
</script>

</body>
</html>
